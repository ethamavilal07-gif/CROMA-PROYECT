<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | CROMA Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div id="toast-notification" class="toast"></div>

    <!-- ENCABEZADO / HEADER -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="./assets/img/logo.png" alt="CROMA Project Logo" class="logo-img">
            </a>
            
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#nosotros">Nosotros</a></li>
                    <li><a href="catalogo.html" style="font-weight: 600; color: #6b1d2f;">Catálogo</a></li>
                    <li><a href="index.html#contacto">Contacto</a></li>
                </ul>
            </nav>

            <div class="header-right">
                <button id="cart-btn" class="btn-cart">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #2b2b2b;">Nuestro Catálogo</h2>
            <p style="color: #666; font-size: 1rem;">Selecciona cualquiera de nuestros productos para personalizarlo a tu gusto.</p>
        </div>

        <section class="catalog">
            <div id="full-catalog-grid" class="products-grid">
                <!-- Se cargan dinámicamente con JavaScript -->
            </div>
        </section>

        <!-- MODAL DEL CARRITO -->
        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Tu Carrito de Compras</h2>
                <div id="cart-items"></div>
                <div class="cart-total">
                    <h3>Total: $<span id="cart-total-price">0</span> MXN</h3>
                </div>
                <button id="whatsapp-send-btn" class="btn-whatsapp">
                    Enviar Pedido por WhatsApp 📲
                </button>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <h3>CROMA Project</h3>
        <p>Sublimados y Productos Personalizados</p>
        <p><small>&copy; 2026 Todos los derechos reservados.</small></p>
    </footer>

    <script src="./assets/js/main.js"></script>
</body>
</html>
